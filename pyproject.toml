[build-system]
requires = ["setuptools>=77", "matplotlib>=3.11.1"]
build-backend = "setuptools.build_meta"

[project]
name = "spiffyplots"
version = "0.6.1"
description = "Publication-ready Matplotlib styles and plotting tools"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    { name = "Julian Rossbroich", email = "julian.rossbroich@fmi.ch" },
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
]

[project.urls]
Documentation = "https://spiffyplots.readthedocs.io"
Issues = "https://github.com/JRBCH/spiffyplots/issues"
Repository = "https://github.com/JRBCH/spiffyplots"

[dependency-groups]
dev = [
    "bump2version",
    "coverage",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
    "twine",
    "watchdog",
]

[tool.setuptools.packages.find]
include = ["spiffyplots*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]
