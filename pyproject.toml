[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spiffyplots"
version = "0.6.1"
description = "Publication-ready Matplotlib styles and plotting tools"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    { name = "Julian Rossbroich", email = "julian.rossbroich@fmi.ch" },
]
dependencies = [
    # 3.8 is the oldest release that supports numpy>=2.
    "matplotlib>=3.8",
    "numpy",
]

[project.optional-dependencies]
# Perceptually uniform colormap families, deliberately not vendored.
# spiffyplots.cmap resolves their names once either is importable.
colormaps = [
    "cmcrameri",
    "colorcet",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
]

[project.urls]
Documentation = "https://spiffyplots.readthedocs.io"
Issues = "https://github.com/JRBCH/spiffyplots/issues"
Repository = "https://github.com/JRBCH/spiffyplots"

[dependency-groups]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
dev = [
    "bump2version",
    "coverage",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "watchdog",
]

[tool.setuptools.packages.find]
include = ["spiffyplots*"]

[tool.setuptools.package-data]
spiffyplots = ["styles/**/*.mplstyle"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.ipynb"]
